version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: go
    opt: module=github.com/fino-io/core/go
  - local: protoc-gen-go-grpc
    out: go
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: go
    opt: paths=source_relative
  - local: protoc-gen-doc
    out: docs
    opt: html,index.html
  - local: protoc-gen-doc
    out: docs
    opt: markdown,docs.md
  - local: protoc-gen-openapiv2
    out: openapi
