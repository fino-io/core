syntax = "proto3";

package fino.core;

import "fino/core/error_code.proto";
import "fino/core/value.proto";

option go_package = "github.com/fino-io/core/go/fino/core;core";

message Error {
  ErrorCode code = 1;

  // a developer-facing error message
  string message = 2;

  // a list if messages that carry the error details
  repeated Value details = 10;
}
