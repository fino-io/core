syntax = "proto3";

package fino.core;

import "fino/core/error_code.proto";
import "fino/core/value.proto";

option go_package = "github.com/fino-io/core/go/fino/core;core";

// Error carries a classified error, a developer-facing message, and structured details.
message Error {
  ErrorCode code = 1;

  // Developer-facing error message; avoid exposing internal details to end users.
  string message = 2;

  // Structured values providing additional error details.
  repeated Value details = 10;
}
